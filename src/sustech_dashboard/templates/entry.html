<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南科大校园面板</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f4;color:#183b36;font:16px/1.6 system-ui,sans-serif}main{max-width:460px;margin:7vh auto;padding:32px;background:white;border-radius:20px;box-shadow:0 12px 45px #183b3610}h1{font-size:28px;margin:0 0 4px}p{color:#657973}label{display:block;margin:16px 0 5px}input:not([type=checkbox]){width:100%;padding:12px;border:1px solid #ccd9d4;border-radius:9px;font:inherit}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#116b58;color:white;font:inherit;cursor:pointer}details{border-top:1px solid #e1e9e5;margin-top:26px;padding-top:18px}summary{cursor:pointer}small{color:#657973}.error{background:#fff1ec;color:#963b24;padding:12px;border-radius:9px}a{color:#116b58}.remember{display:flex;align-items:center;gap:8px} @media(max-width:520px){main{margin:20px 12px;padding:24px}}
</style></head><body><main>
<h1>南科大校园面板</h1><p>课程、作业、资料和校园服务</p>
{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}
<form method="post" action="/app/">
<input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="login"><input type="hidden" name="desktop_key" value="{{ desktop_key }}">
<label for="username">面板账号</label><input id="username" name="username" autocomplete="username" required maxlength="64">
<label for="password">面板密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
<label class="remember"><input type="checkbox" name="remember" checked>记住登录</label><button type="submit">进入面板</button>
</form><small>使用现有面板账号登录；已安装的本机组件会在登录后自动连接。浏览器提示打开校园面板时允许即可。</small>
<details id="activation"><summary>首次使用：用邀请开通</summary>
<form method="post" action="/app/">
<input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="activate"><input type="hidden" name="remember" value="on"><input type="hidden" name="desktop_key" value="{{ desktop_key }}">
<label for="invitation">邀请链接或邀请码</label><input id="invitation" name="invitation" autocomplete="off" required>
<label for="new-user">设置面板账号</label><input id="new-user" name="username" autocomplete="username" required maxlength="64">
<label for="new-password">设置面板密码</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
<small>至少 12 个字符；开通后自动进入自己的面板。</small><p><small>托管运营者在技术上能够接触运行中的凭据和个人数据。校园账号在进入面板后单独绑定。</small></p>
<button type="submit">开通并进入</button>
</form></details>
</main><script src="/app/static/entry.js"></script></body></html>
