{% extends 'base.html' %}
{% block header %}<h1>从学校下载附件</h1>{% endblock %}
{% block content %}<section class="wide"><p>文件由 Blackboard 直接发送到你的浏览器。面板不会读取、转发或保存文件。</p><p>首次使用或学校登录过期时，请先打开官方内容页并在学校登录。面板登录与学校登录分别管理。</p><p><a class="button" href="{{ official_url }}" target="_blank" rel="noopener noreferrer">打开官方内容页并登录</a></p><p><a class="button secondary" href="{{ download_url }}" target="_blank" rel="noopener noreferrer">已登录学校，直接下载</a></p><p>如果下载入口失效，请在官方内容页查找最新附件，再返回面板刷新清单。浏览器负责保存目录和下载权限；本页面不会把打开链接记为已保存。</p><p><a href="{{ api_base }}/">返回校园面板</a></p></section>{% endblock %}
