{% extends 'service_base.html' %}
{% block content %}
<section class="wide" data-service="selection"><form class="toolbar" id="selection-term-form"><label>学年<input id="selection-year" pattern="20[0-9]{2}-20[0-9]{2}" placeholder="2026-2027" required></label><label>学期<select id="selection-season"><option value="1">秋季</option><option value="2">春季</option><option value="3">夏季</option></select></label><button>查询学期</button><a href="https://tis.sustech.edu.cn/" target="_blank" rel="noopener">官方教务系统</a></form><div id="service-message" role="status"></div><div id="selection-rounds"></div></section>
<section class="wide"><div class="heading"><h2>本学期选课</h2><button id="selection-export" class="secondary">导出已选课日历</button></div><div class="split"><div><h3>已选课程 <span class="pill" id="selection-credits"></span></h3><div id="selection-enrolled"></div></div><div><h3>官方购物车</h3><div id="selection-cart"></div></div></div></section>
<section class="wide"><h2>课程目录</h2><form class="toolbar" id="selection-search-form"><label>查询范围<select id="selection-mode"><option value="campus">全校课程目录</option><option value="personal">本轮本人可选课程</option></select></label><label>选课轮次<select id="selection-round"></select></label><label>课程<input id="selection-query" type="search" placeholder="课程名、代码"></label><label>教师<input id="selection-teacher" placeholder="教师姓名"></label><label>类别<input id="selection-category" placeholder="例如：通识必修课"></label><label>教学语言<input id="selection-language" placeholder="例如：英文"></label><button>搜索课程</button></form><p class="muted">目录中的班额不保证当前可选；提交前重新检查选课窗口、权限和冲突。</p><div id="selection-results"></div><div id="selection-pages" class="actions"></div></section>
<section class="wide"><h2>备选排课</h2><p class="muted">输入课程代码或从目录加入，生成每门课程各选一个教学班的无冲突方案。此处生成方案不会改变已选课。</p><form id="selection-plan-form"><label>课程代码（最多 8 门，以空格或逗号分隔）<input id="selection-codes" placeholder="MA117 PHY105 …" required></label><div class="toolbar"><label><span><input id="selection-keep" type="checkbox" checked> 保留其他已选课程</span></label><button>生成备选方案</button></div></form><div id="selection-plans"></div></section>
<section class="wide" id="selection-review" hidden><h2>核对选课操作</h2><div id="selection-review-detail"></div><div class="actions"><button id="selection-confirm">确认执行</button><button id="selection-cancel" class="secondary">取消</button></div></section>
{% endblock %}
