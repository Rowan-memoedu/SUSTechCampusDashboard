<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开通校园面板</title><link rel="stylesheet" href="{{ url_for('static',filename='campus.css') }}"></head><body><main><section class="wide"><h1>开通你的校园面板</h1><p>邀请仅适用于这个独立空间，限时且只能使用一次。先设置面板密码，随后登录并绑定校园账号。面板用户名为 <strong>member</strong>。</p><p>请为面板设置与 CAS 不同的密码。</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>邀请凭证<input id="invitation" name="invitation" autocomplete="off" required maxlength="43"></label><label>面板密码<input type="password" name="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button>设置密码并开通</button></form></section></main><script src="{{ url_for('static',filename='invite.js') }}"></script></body></html>
