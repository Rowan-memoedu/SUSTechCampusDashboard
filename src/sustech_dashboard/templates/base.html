<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}南科大校园面板{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='campus.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='materials.css') }}"></head><body>
<header>{% block header %}<h1>南科大校园面板</h1><p id="updated">正在读取校园数据…</p>{% endblock %}<nav class="header-actions"><a href="{{ api_base }}/settings">{{ '空间与账号' if hosted else '本机与更新' }}</a>{% if hosted %}<a href="{{ api_base }}/setup">绑定与断开学校账号</a>{% endif %}{% if browser_login %}<form method="post" action="{{ url_for('web_logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button type="submit" class="secondary">退出面板登录</button></form>{% endif %}</nav></header>
<main>{% block content %}{% endblock %}</main>
{% if not hosted %}<footer><a href="{{ api_base }}/connect">连接当前电脑到公网打印</a></footer>{% endif %}
<script>const roomCsrf={{ csrf_token|tojson }};const apiBase={{ api_base|tojson }};</script><script src="{{ url_for('static',filename='common.js') }}"></script>
{% if hosted %}<script src="{{ url_for('static',filename='computer.js') }}"></script>{% endif %}
{% block scripts %}{% endblock %}</body></html>
