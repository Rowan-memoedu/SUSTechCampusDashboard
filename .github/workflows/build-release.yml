name: Build and verify distribution

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.5.1)
        required: true
        type: string
      publish:
        description: Publish verified downloads to GitHub Release
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark downloads as a preview release (recommended until interactive Windows acceptance)
        required: true
        default: true
        type: boolean

permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: distribution-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x86_64
            executable: campus-client.exe
          - os: ubuntu-24.04
            platform: linux-x86_64
            executable: campus-client
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Validate tag and source version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -c "import os,re; from pathlib import Path; tag=os.environ['RELEASE_TAG']; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag); text=Path('src/sustech_dashboard/__init__.py').read_text(); assert ('\"'+tag[1:]+'\"') in text"
          git rev-parse HEAD > source-commit.txt
      - name: Install dependencies
        run: python -m pip install -e . -r requirements-build.txt
      - name: Install nginx for Linux regression
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Regression tests
        if: runner.os == 'Linux'
        run: python -m pytest -q
      - name: Regression tests as a standard Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/run_windows_acceptance.ps1 -Python (Get-Command python).Source -Arguments @('-m','pytest','-q','-o','cache_dir=__USER_TEMP__/pytest-cache')
      - name: Coursework browser acceptance with isolated school fixtures
        run: python deploy/verify_coursework_ui.py --output ui-acceptance --cache ui-cache
      - name: Save synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-${{ matrix.platform }}
          path: ui-acceptance
          if-no-files-found: ignore
          retention-days: 7
      - name: Build runtime
        run: python deploy/build_client.py --output dist --work build-cache
      - name: Clean first run and local authentication
        if: runner.os == 'Linux'
        run: python deploy/verify_client.py dist/campus-client/${{ matrix.executable }} --cache acceptance-cache
      - name: Clean first run as a standard Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/run_windows_acceptance.ps1 -Python (Get-Command python).Source -Arguments @('deploy/verify_client.py','dist/campus-client/campus-client.exe','--cache','__USER_TEMP__/client-acceptance')
      - name: Check runtime archive
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          python -c "import os; from deploy.release_assets import audit_archive; p=os.environ['RELEASE_PLATFORM']; print(audit_archive('dist/'+p+'.zip',os.environ['RELEASE_TAG'][1:],p))"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: python deploy/build_installer.py --bundle dist/campus-client --output dist --compiler "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
      - name: Installer registration, uninstall and data retention as a standard user
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./deploy/run_windows_acceptance.ps1 -Python (Get-Command python).Source -Arguments @('deploy/verify_installer.py',"dist/SUSTechCampusDashboard-$($env:RELEASE_TAG.Substring(1))-windows-x86_64-setup.exe",'--cache','__USER_TEMP__/installer-acceptance')
      - name: Save only distribution assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}.zip
            dist/*-setup.exe
            dist/installer.json
            source-commit.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distribution-*
          path: release-assets
          merge-multiple: true
      - name: Verify receipts and prepare public manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python deploy/release_assets.py --directory release-assets/dist --version "${RELEASE_TAG#v}" --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-downloads
          path: |
            release-assets/dist/*.zip
            release-assets/dist/*-setup.exe
            release-assets/dist/release-manifest.json
            release-assets/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Publish immutable version assets
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          PREVIEW_RELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--verify-tag --generate-notes --latest=false)
          if [ "$PREVIEW_RELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" release-assets/dist/windows-x86_64.zip release-assets/dist/linux-x86_64.zip "release-assets/dist/SUSTechCampusDashboard-${RELEASE_TAG#v}-windows-x86_64-setup.exe" release-assets/dist/release-manifest.json release-assets/dist/SHA256SUMS
