name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e . -r requirements-build.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nginx
      - if: runner.os == 'Linux'
        run: python -m pytest -q
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/run_windows_acceptance.ps1 -Python (Get-Command python).Source -Arguments @('-m','pytest','-q','-o','cache_dir=__USER_TEMP__/pytest-cache')
