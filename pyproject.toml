[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "sustech-campus-dashboard"
version = "0.1.0"
description = "Private SUSTech dashboard, Blackboard coursework and campus bookings"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0,<4",
  "waitress>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "pycryptodome>=3.20,<4",
  "sustech_survival @ git+https://github.com/dumixthestpd/sustech_survival.git@acd20323af6d3bc91c3e89974283d39d85109678",
]

[project.scripts]
sustech-dashboard = "sustech_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sustech_dashboard"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
