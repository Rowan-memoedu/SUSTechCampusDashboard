# BEGIN SUSTech campus dashboard
location = /campus { return 302 /campus/; }
location = /campus/auth/login { return 302 /app/?login=1; }
location = /campus/invite { return 302 /app/?login=1; }
location ^~ /campus/ {
    auth_basic off;
    auth_request /_sustech_campus_auth;
    error_page 401 = @sustech_campus_login;
    client_max_body_size 256m;
    client_body_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:18771/;
    proxy_http_version 1.1;
    proxy_set_header Host 124.221.144.155;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /campus;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    access_log off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
location = /_sustech_campus_auth {
    internal;
    # Subrequests inherit the original Content-Length even with body forwarding off.
    # Match /campus/ so the enclosing server's smaller limit cannot reject uploads.
    client_max_body_size 256m;
    proxy_pass http://127.0.0.1:18771/auth/verify;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host 124.221.144.155;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /campus;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Campus-Original-URI $request_uri;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    access_log off;
}
location @sustech_campus_login {
    default_type application/json;
    if ($request_uri ~ "^/campus/api/") {
        return 401 '{"error":"请登录校园面板","login_url":"/app/?login=1"}';
    }
    return 302 /app/?login=1;
}
# END SUSTech campus dashboard
