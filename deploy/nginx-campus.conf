# BEGIN SUSTech campus dashboard
location = /campus { return 302 /campus/; }
location ^~ /campus/ {
    auth_basic "SUSTech campus dashboard";
    auth_basic_user_file /etc/nginx/sustech-campus.htpasswd;
    client_max_body_size 256m;
    client_body_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:18771/;
    proxy_http_version 1.1;
    proxy_set_header Host 124.221.144.155;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /campus;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    access_log off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
# END SUSTech campus dashboard
